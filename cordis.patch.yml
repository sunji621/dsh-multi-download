# dsh-multi-download 的 bundle 装配层。
# 装载后向 host 注入一个插件实例，注册 download_file / download_task 两个模型工具。
- insert:
    - id: dsh-multi-download
      name: dsh-multi-download
      config:
        # 默认并发连接数（工具参数 connections 可逐个覆盖，上限 maxConnections）
        connections: 8
        maxConnections: 16
        # 小于该字节数的文件不分段，直接单连接
        minSegmentBytes: 2097152
        # dest 传相对路径时的基准目录；留空 = 用户 Downloads 目录（也可用环境变量 DSH_DOWNLOAD_DIR）
        baseDir: ''
